<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>

    <link rel="stylesheet" href="assets/css/global.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebarTop">
            <div class="memoriaLogo">
                <img src="assets/images/MemoriaLogo.png" alt="Memoria Logo">
            </div>

            <div class="sidebarDateTime" id="dateTimeDisplay"></div>
        </div>

        <div class="sidebarNav">
            <div class="sidebarSection">Main</div>
            <div class="menu"><i class="fas fa-chart-pie"></i>Dashboard</div>
            <div class="menu"><i class="fas fa-folder-open"></i>Records</div>
            <div class="menu active"><i class="fas fa-map"></i>Map</div>

            <div class="sidebarSection">Management</div>
            <div class="menu"><i class="fas fa-thumbtack"></i>Reserve</div>
            <div class="menu"><i class="fas fa-bell"></i>Monitor</div>
            <div class="menu"><i class="fas fa-user"></i>Accounts</div>
            <div class="menu"><i class="fas fa-user"></i>Reports</div>

            <div class="sidebarSection">System</div>
            <div class="menu"><i class="fas fa-history"></i>Logs</div>
            <div class="menu"><i class="fas fa-cog"></i>Settings</div>
        </div>

        <div class="sidebarFooter">
            <div class="userCard">
                <div class="userAvatar">
                    <div class="avatarBox">AD</div>
                    <div class="statusIndicator"></div>
                </div>

                <div class="userDetails">
                    <span class="username">Admin</span>
                    <span class="userRole">Administrator</span>
                </div>

                <button class="logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script src="assets/js/main.js"></script>
</body>
</html>
