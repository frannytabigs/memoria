<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <meta content="/" property="og:url" />
    <meta property="og:site_name" content="Memoria" />
    <meta content="#2f3136" name="theme-color" />
    <meta name="author" content="Team DND" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://static.wikia.nocookie.net/reborn/images/6/67/Sky_Ring_Battle.PNG/revision/latest?cb=20120422065712"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />
    <title>Map</title>

    <link rel="stylesheet" href="assets/css/root.css" />
    <link
      rel="stylesheet"
      href="api/rootcolors.php"
      onerror="
        console.error('Failed to load custom colors. Using default theme.')
      "
    />
    <link rel="stylesheet" href="assets/css/global.css" />
    <link rel="stylesheet" href="assets/css/map.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      // Run this instantly before the page paints
      if (localStorage.getItem("memoria_role") === "Administrator") {
        document.documentElement.classList.add("is-admin");
      }
    </script>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebarTop">
        <div class="memoriaLogo">
          <img src="assets/images/MemoriaLogo.png" alt="Memoria Logo" />
        </div>

        <div class="sidebarDateTime" id="dateTimeDisplay"></div>
      </div>

      <div class="sidebarNav">
        <div class="sidebarSection">Main</div>
        <a href="dashboard.html">
          <div class="menu"><i class="fas fa-chart-pie"></i>Dashboard</div>
        </a>
        <a href="records.html">
          <div class="menu"><i class="fas fa-folder-open"></i>Records</div>
        </a>
        <a href="map.html">
          <div class="menu active"><i class="fas fa-map"></i>Map</div>
        </a>

        <div class="sidebarSection">Management</div>
        <a href="reserve.html">
          <div class="menu"><i class="fas fa-thumbtack"></i>Reserve</div>
        </a>
        <a href="monitor.html">
          <div class="menu"><i class="fas fa-bell"></i>Monitor</div>
        </a>
        <a href="accounts.html" class="adminOnly">
          <div class="menu"><i class="fas fa-user"></i>Accounts</div>
        </a>
        <a href="reports.html">
          <div class="menu"><i class="fas fa-file-alt"></i>Reports</div>
        </a>

        <div class="sidebarSection">System</div>
        <a href="logs.html" class="adminOnly">
          <div class="menu"><i class="fas fa-history"></i>Logs</div>
        </a>
        <a href="settings.html">
          <div class="menu"><i class="fas fa-cog"></i>Settings</div>
        </a>
      </div>

      <div class="sidebarFooter">
        <div class="userCard">
          <div class="userAvatar">
            <div class="avatarBox" id="usernameLogo"></div>
            <div class="statusIndicator"></div>
          </div>

          <div class="userDetails">
            <span class="username" id="usernameLabel"></span>
            <span class="userRole" id="roleLabel"></span>
          </div>

          <button class="logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="mapCard">
        <div class="mapHeader">
          <h3>Mandaue City Public Cemetery 2D Map</h3>
          <div class="mapBtn">
            <!-- Normal map-edit toolbar -->
            <button class="editBtn" id="btnEditMap">Edit map</button>
            <button class="saveBtn" id="btnSaveMap" style="display: none">
              Save map
            </button>
            <button class="plotBtn" id="btnAddBlock" style="display: none">
              Add block
            </button>
            <button class="cancelBtn" id="btnCancelAdd" style="display: none">
              Cancel draw
            </button>
            <!-- Reshape sub-toolbar (shown only during reshape mode) -->
            <button
              class="reshapeSubBtn active"
              id="btnCutLine"
              style="display: none"
              onclick="MAP.setReshapeTool('cut')"
            >
              &#9986; Cut Line
            </button>
            <button
              class="reshapeSubBtn"
              id="btnDrawLine"
              style="display: none"
              onclick="MAP.setReshapeTool('draw')"
            >
              &#9998; Draw Line
            </button>
            <button
              class="reshapeSubBtn done"
              id="btnDoneReshape"
              style="display: none"
              onclick="MAP.exitReshapeMode()"
            >
              &#10003; Done Reshape
            </button>
            <button
              class="cancelBtn"
              id="btnUndoReshape"
              style="display: none"
              onclick="MAP.undoReshape()"
            >
              &#8630; Undo
            </button>
          </div>
        </div>

        <div class="mapSearch">
          <input
            type="text"
            id="mapSearchInput"
            placeholder="Search by name..."
          />
        </div>
        <div class="searchResults" id="searchResults"></div>

        <div class="mapMeta">
          <div class="mapBreadcrumb" id="mapBreadcrumb"></div>
          <div class="mapStatus" id="mapStatus"></div>
        </div>

        <div class="mapCanvas" id="mapCanvas">
          <canvas id="mapCvs"></canvas>
          <div class="mapHint" id="mapHint"></div>
          <div class="mapLoading" id="mapLoading">Loading map&hellip;</div>
        </div>

        <div class="plotView" id="plotView">
          <div class="plotViewHeader">
            <span class="plotViewTitle" id="pvTitle"></span>
            <span class="plotModeBadge" id="pvBadge">Editing plots</span>
            <button class="pvBtn" onclick="MAP.backToMap()">
              &#8592; Map overview
            </button>
            <button
              class="pvBtn primary"
              id="btnEditBlock"
              onclick="MAP.toggleEditBlock()"
            >
              Edit block
            </button>
            <button
              class="pvBtn success"
              id="btnDoneBlock"
              onclick="MAP.toggleEditBlock()"
              style="display: none"
            >
              Done editing
            </button>
          </div>
          <div class="plotGrid" id="plotGrid"></div>
        </div>

        <div class="mapLegend">
          <div class="legendItem">
            <div
              class="legendDot"
              style="background: #fff; border-color: #cbd5e1"
            ></div>
            Available
          </div>
          <div class="legendItem">
            <div
              class="legendDot"
              style="background: #dcfce7; border-color: #4ade80"
            ></div>
            Occupied
          </div>
          <div class="legendItem">
            <div
              class="legendDot"
              style="background: #dbeafe; border-color: #60a5fa"
            ></div>
            Reserved
          </div>
        </div>
      </div>
    </div>

    <div class="modalOverlay" id="modalOverlay">
      <div class="modalBox">
        <h3 id="modalTitle"></h3>
        <div id="modalBody"></div>
        <div class="modalActions">
          <button id="modalCancel">Cancel</button>
          <button id="modalConfirm" class="btnPrimary">Save</button>
        </div>
      </div>
    </div>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/alert.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
