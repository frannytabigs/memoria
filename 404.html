<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta

    />
    <meta content="/" property="og:url" />
    <meta property="og:site_name" content="Memoria" />
    <meta content="#2f3136" name="theme-color" />
    <meta name="author" content="Team DND" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://static.wikia.nocookie.net/reborn/images/6/67/Sky_Ring_Battle.PNG/revision/latest?cb=20120422065712"
    />

    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />
    <title>404 - Page Not Found</title>
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 100px;
        background: #f4f4f9;
        color: #333;
      }
      h1 {
        font-size: 50px;
        margin-bottom: 10px;
      }
      p {
        font-size: 18px;
        color: #666;
      }
      button {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Oops! The page you are looking for doesn't exist.</p>
    <button
      onclick="
        var loc = window.location;

        // Check if the hostname is a local IP (192.168.x.x, 10.x.x.x, 172.x.x.x) or localhost
        var isLocalIP =
          /(?:^localhost$)|(?:^127\.)|(?:^192\.168\.)|(?:^10\.)|(?:^172\.(?:1[6-9]|2\d|3[0-1])\.)/.test(
            loc.hostname,
          );

        if (loc.protocol === 'file:') {
          // 1. Opened as a raw file
          window.location.href =
            loc.href.split('/memoria/')[0] + '/memoria/index.html';
        } else if (isLocalIP || loc.pathname.includes('/memoria/')) {
          // 2. Opened via XAMPP, a mobile device on the same WiFi, or the URL explicitly contains the folder
          window.location.href = '/memoria/';
        } else {
          // 3. Hosted live on a root domain (www.yourdomain.com/)
          window.location.href = '/';
        }
      "
    >
      Go back home
    </button>
  </body>
</html>
