<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <meta content="/" property="og:url" />
    <meta property="og:site_name" content="Memoria" />
    <meta content="#2f3136" name="theme-color" />
    <meta name="author" content="Team DND" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://static.wikia.nocookie.net/reborn/images/6/67/Sky_Ring_Battle.PNG/revision/latest?cb=20120422065712"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />
    <title>Sign Up</title>

    <link rel="stylesheet" href="assets/css/root.css" />
    <link
      rel="stylesheet"
      href="api/rootcolors.php"
      onerror="
        console.error('Failed to load custom colors. Using default theme.')
      "
    />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="container">
        <div class="logoSection">
          <img
            src="api/images/logo1.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MandaueLogo.png';
              console.error('Failed to load dynamic logo. Using default logo.');
            "
            alt="Mandaue City Logo"
          />
          <img
            src="api/images/logo2.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/DGSLogo.png';
              console.error('Failed to load dynamic logo. Using default logo.');
            "
            src="assets/images/DGSLogo.png"
            alt="Department of General Services Logo"
          />

          <div class="headerText">
            <h1 id="heading_one">Depertment of General Services</h1>
            <h2 id="cemetery_address">Mandaue City</h2>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main">
      <!-- HERO SECTION -->
      <section>
        <div class="banner">
          <img
            src="api/images/cemetery_logo.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MemoriaLogo.png';
              console.error('Failed to load dynamic logo. Using default logo.');
            "
            alt="Memoria Logo"
          />
          <p class="cemeteryName" id="cemetery_name">
            Mandaue City Public Cemetery
          </p>
        </div>
      </section>

      <!-- SIGNUP FORM -->
      <section>
        <div class="inputWrapper">
          <div class="inputHeader">
            <h2>Register Account</h2>
            <p>Register for access to Memoria system.</p>
          </div>

          <form action="#" id="signupform">
            <div class="inputBox">
              <input
                type="text"
                placeholder="Fullname"
                name="name"
                id="name"
                required
              />
            </div>

            <div class="inputBox">
              <input
                type="text"
                placeholder="Username"
                name="username"
                id="username"
                required
              />
            </div>

            <div class="inputBox">
              <input
                type="email"
                placeholder="Email Address"
                name="email"
                id="email"
                required
              />
            </div>

            <div class="inputBox">
              <input
                type="tel"
                placeholder="Phone Number"
                name="phone_number"
                id="phone_number"
                required
              />
            </div>

            <div class="inputBox passwordBox">
              <input
                type="password"
                placeholder="Password"
                name="password"
                id="password"
                required
              />
              <button
                type="button"
                class="togglePassword"
                id="togglePassword"
                aria-label="Toggle password visibility"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="eye-open"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="eye-closed"
                  style="display: none"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  ></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>

            <label class="termsConditions">
              <input type="checkbox" required />
              <span>I agree to terms & conditions</span>
            </label>

            <button
              type="submit"
              class="singupBtn signupPage"
              id="signupbutton"
            >
              Sign Up
            </button>
          </form>

          <!-- RETURN TO LOGIN PAGE -->
          <div class="loginLink">Back to <a href="index.html">Log In</a></div>
        </div>
      </section>
    </div>

    <script src="assets/js/modal.js"></script>
    <script src="assets/js/alert.js"></script>
    <script src="assets/js/loggedinalready.js"></script>
    <script src="assets/js/signup.js"></script>
    <script src="assets/js/togglepassword.js"></script>
  </body>
</html>
