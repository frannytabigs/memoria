<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="assets/css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container">
            <div class="logoSection">
                <img src="assets/images/MandaueLogo.png" alt="Mandaue City Logo">
                <img src="assets/images/DGSLogo.png" alt="Department of General Services Logo">

                <div class="headerText">
                    <h1>Depertment of General Services</h1>
                    <h2>Mandaue City</h2>
                </div>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main">
        <!-- HERO SECTION -->
        <section>
            <div class="banner">
                <img src="assets/images/MemoriaLogo.png" alt="Memoria Logo">
                <p class="cemeteryName">Mandaue City Public Cemetery</p>
            </div>
        </section>

        <!-- SIGNUP FORM -->
        <section>
            <div class="inputWrapper">
                <div class="inputHeader">
                    <h2>Account Recovery</h2>
                    <p>Verify your details to reset your password.</p>
                </div>
                
                <form action="#">
                    <div class="inputBox">
                        <input type="text" placeholder="Fullname" required>
                    </div>

                    <div class="inputBox">
                        <input type="text" placeholder="Username" required>
                    </div>

                    <div class="inputBox">
                        <input type="email" placeholder="Email Address" required>
                    </div>

                    <div class="inputBox">
                        <input type="tel" placeholder="Phone Number">
                    </div>

                    <div class="inputBox">
                        <input type="password" placeholder="New Password" required>
                    </div>

                    <button type="submit" class="resetBtn">Reset Password</button>
                </form>

                <!-- RETURN TO LOGIN PAGE -->
                <div class="loginLink">
                    Back to <a href="index.html">Log In</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
