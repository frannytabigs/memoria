<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Memoria - Login</title>
    <link rel="stylesheet" href="assets/css/modal.css" />
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        padding-top: 100px;
        background: #f4f4f9;
        color: #333;
      }
      h1 {
        font-size: 50px;
        margin-bottom: 10px;
      }
      p {
        font-size: 18px;
        color: #666;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>Hello</h1>
    <p>Memoria: Mandaue City Municipal Cemetery Monitoring System</p>
    <form id="loginform">
      <label for="username">Username:</label><br />
      <input
        type="text"
        placeholder="Username"
        name="username"
        required
      /><br /><br />
      <label for="password">Password:</label><br />
      <input
        type="password"
        placeholder="Password"
        name="password"
        required
      /><br /><br />
      <button type="submit">Log In</button>
    </form>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/login.js"></script>
  </body>
</html>
