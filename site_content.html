# 🕊️ REQUEST FOR BURIAL SPACE

**Who May Avail:** Mandaue City Residents
**Classification:** Simple (G2C)

---

## 📋 Checklist of Requirements

| Requirement                                    | Where to Secure    |
| ---------------------------------------------- | ------------------ |
| **1. Death Certificate** — 1 copy              | City Health Office |
| **2. Barangay Certification** — 1 copy         | Barangay concerned |
| **3. Exhumation and Reburial Permit** — 1 copy | City Health Office |

---

## 📝 Client Steps & Process

**1. Submit Request**
Submit a letter request to the receiving clerk.

> **Fee:** None · **Processing Time:** 5 minutes · **Person Responsible:** Section Head

**2. Verification**
The office verifies the logbook for burial space availability and confirms availability with the cemetery in-charge.

> **Fee:** None · **Processing Time:** 20 minutes

**3. Certification Issuance**
The office issues the Certification and forwards it to the Section Head.

> **Fee:** None · **Processing Time:** 8 hours

**4. Receive Certification**
Receive **one (1) original copy** of the Certification. The office retains a file copy.

> **Fee:** None · **Processing Time:** 5 minutes

---

## 💰 Processing Summary

**Total Fees:** NONE
**Total Processing Time:** **1 Day, 30 Minutes**

---

## 📜 Plot Lease Renewal Requirements

Please prepare the following:

* **Original Certificate of Plot Allocation / Deed**
* **Government-issued ID of the Deed Holder**
* **Latest Official Receipt of Annual Lease/Maintenance Fee**

---

## 🧹 Visitor & Cleaning Guidelines

* 🕕 **Cemetery Hours:** Open daily from **6:00 AM to 6:00 PM**
* 🗑️ **Clean As You Go (CLAYGO):** Strictly enforced
* 🔇 **Noise Policy:** No loud sound systems are allowed
* 🚫 **Alcohol Policy:** Alcoholic beverages are not allowed

---

### 🤍 Important Reminder

Please ensure that all required documents are complete and available before submitting your request to help make the process faster and smoother.</textarea
