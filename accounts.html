<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <meta content="/" property="og:url" />
    <meta property="og:site_name" content="Memoria" />
    <meta content="#2f3136" name="theme-color" />
    <meta name="author" content="Team DND" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://static.wikia.nocookie.net/reborn/images/6/67/Sky_Ring_Battle.PNG/revision/latest?cb=20120422065712"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />
    <title>Accounts</title>

    <link rel="stylesheet" href="assets/css/root.css" />
    <link
      rel="stylesheet"
      href="api/rootcolors.php"
      onerror="
        console.error('Failed to load custom colors. Using default theme.')
      "
    />
    <link rel="stylesheet" href="assets/css/accounts.css" />
    <link rel="stylesheet" href="assets/css/sidebar.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script>
      // Run this instantly before the page paints
      if (localStorage.getItem("memoria_role") === "Administrator") {
        document.documentElement.classList.add("role-admin");
      }
      if (localStorage.getItem("memoria_role") === "Office Staff") {
        document.documentElement.classList.add("role-office");
      }
      if (localStorage.getItem("memoria_role") === "Grounds Staff") {
        document.documentElement.classList.add("role-grounds");
      }
    </script>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebarTop">
        <div class="memoriaLogo" id="logoToggle">
          <img
            id="cemetery-logo"
            src="api/images/cemetery_logo.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MemoriaLogo.png';
              console.error('Failed to load dynamic logo. Using default logo.');
            "
            alt="Memoria Logo"
            class="fullLogo"
          />
          <img
            alt="M Logo"
            class="collapsedLogo"
            id="cemetery-logo-small"
            src="api/images/cemetery_logo_small.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MLogo.png';
              console.error('Failed to load dynamic logo. Using default logo.');
            "
          />
        </div>

        <div class="sidebarDateTime" id="dateTimeDisplay"></div>
      </div>

      <div class="sidebarNav">
        <div class="sidebarSection">Main</div>
        <a href="dashboard.html" class="menu"
          ><i class="fas fa-chart-pie"></i><span>Dashboard</span></a
        >
        <a href="records.html" class="menu admin-office-only"
          ><i class="fas fa-folder-open"></i><span>Records</span></a
        >
        <a href="map.html" class="menu admin-office-only"
          ><i class="fas fa-map"></i><span>Map</span></a
        >

        <div class="sidebarSection">Management</div>
        <a href="reserve.html" class="menu"
          ><i class="fas fa-thumbtack"></i><span>Reserve</span></a
        >
        <a href="monitor.html" class="menu admin-office-only"
          ><i class="fas fa-bell"></i><span>Monitor</span></a
        >
        <a href="payments.html" class="menu"
          ><i class="fa-solid fa-receipt"></i><span>Payments</span></a
        >
        <a href="accounts.html" class="menu active adminOnly"
          ><i class="fas fa-user"></i><span>Accounts</span></a
        >
        <a href="reports.html" class="menu admin-office-only"
          ><i class="fas fa-file-alt"></i><span>Reports</span></a
        >

        <div class="sidebarSection">System</div>
        <a href="site_content.html" class="menu admin-office-only"
          ><i class="fa-solid fa-pen-to-square"></i><span>Site Content</span></a
        >
        <a href="logs.html" class="menu adminOnly"
          ><i class="fas fa-history"></i><span>Logs</span></a
        >
        <a href="settings.html" class="menu"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>

      <div class="sidebarFooter">
        <div class="userCard">
          <div class="userAvatar">
            <div class="avatarBox" id="usernameLogo"></div>
            <div class="statusIndicator"></div>
          </div>

          <div class="userDetails">
            <span class="username" id="usernameLabel"></span>
            <span class="userRole" id="roleLabel"></span>
          </div>

          <button class="logout">
            <i class="fas fa-sign-out-alt"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="tableControls">
        <div class="searchBox">
          <i class="fas fa-search"></i>
          <input type="text" id="userSearch" placeholder="Search..." />
          <i class="fas fa-times" id="clearSearchBtn" title="Clear search"></i>
        </div>

        <div class="controlItem">
          <select id="statusFilter" class="mainSelect">
            <option value="all">All Status</option>
            <option value="verified">Verified</option>
            <option value="unverified">Unverified</option>
          </select>
        </div>

        <div class="controlItem">
          <select id="roleFilter" class="mainSelect">
            <option value="all">All Roles</option>
            <option value="office staff">Office Staff</option>
            <option value="grounds staff">Grounds Staff</option>
            <option value="administrator">Administrator</option>
          </select>
        </div>

        <button class="filterActionBtn" id="filterBtn">
          <i class="fas fa-filter"></i>
          <span>Filter</span>
        </button>
      </div>

      <div class="table">
        <div class="tableHeader">
          <h3>User Accounts</h3>
        </div>

        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Phone Number</th>
              <th>Role</th>
              <th>Status</th>
              <th>ID</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr class="skeleton-row" style="pointer-events: none">
              <td>
                <div class="skeleton-box" style="width: 18%"></div>
              </td>
              <td>
                <div class="skeleton-box" style="width: 10%"></div>
              </td>
              <td>
                <div class="skeleton-box" style="width: 18%"></div>
              </td>
              <td><div class="skeleton-box" style="width: 14%"></div></td>
              <td><div class="skeleton-box" style="width: 10%"></div></td>
              <td><div class="skeleton-box" style="width: 10%"></div></td>
              <td><div class="skeleton-box" style="width: 50%"></div></td>
              <td>
                <div
                  class="skeleton-box"
                  style="width: 80px; height: 30px; border-radius: 6px"
                ></div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="assets/js/alert.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script>
      initAuth(["Administrator"]);
    </script>
    <script src="assets/js/accounts.js"></script>
  </body>
</html>
