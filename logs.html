<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <title>Logs</title>

    <link rel="stylesheet" href="assets/css/root.css" />
    <link
      rel="stylesheet"
      href="api/rootcolors.php"
      onerror="
        console.error('Failed to load custom colors. Using default theme.')
      "
    />
    <link rel="stylesheet" href="assets/css/sidebar.css" />
    <link rel="stylesheet" href="assets/css/logs.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script>
      // Run this instantly before the page paints
      if (localStorage.getItem("memoria_role") === "Administrator") {
        document.documentElement.classList.add("role-admin");
      }
      if (localStorage.getItem("memoria_role") === "Office Staff") {
        document.documentElement.classList.add("role-office");
      }
      if (localStorage.getItem("memoria_role") === "Grounds Staff") {
        document.documentElement.classList.add("role-grounds");
      }
    </script>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebarTop">
        <div class="memoriaLogo" id="logoToggle">
          <img
            id="cemetery-logo"
            src="api/images/cemetery_logo.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MemoriaLogo.png';
            "
            alt="Memoria Logo"
            class="fullLogo"
          />
          <img
            id="cemetery-logo-small"
            src="api/images/cemetery_logo_small.png"
            onerror="
              this.onerror = null;
              this.src = 'assets/images/MLogo.png';
            "
            alt="M Logo"
            class="collapsedLogo"
          />
        </div>
        <div class="sidebarDateTime" id="dateTimeDisplay"></div>
      </div>

      <div class="sidebarNav">
        <div class="sidebarSection">Main</div>
        <a href="dashboard.html" class="menu"
          ><i class="fas fa-chart-pie"></i><span>Dashboard</span></a
        >
        <a href="records.html" class="menu admin-office-only"
          ><i class="fas fa-folder-open"></i><span>Records</span></a
        >
        <a href="map.html" class="menu admin-office-only"
          ><i class="fas fa-map"></i><span>Map</span></a
        >

        <div class="sidebarSection">Management</div>
        <a href="reserve.html" class="menu"
          ><i class="fas fa-thumbtack"></i><span>Reserve</span></a
        >
        <a href="monitor.html" class="menu admin-office-only"
          ><i class="fas fa-bell"></i><span>Monitor</span></a
        >
        <a href="payments.html" class="menu"
          ><i class="fa-solid fa-receipt"></i><span>Payments</span></a
        >
        <a href="accounts.html" class="menu adminOnly"
          ><i class="fas fa-user"></i><span>Accounts</span></a
        >
        <a href="reports.html" class="menu admin-office-only"
          ><i class="fas fa-file-alt"></i><span>Reports</span></a
        >

        <div class="sidebarSection">System</div>
        <a href="site_content.html" class="menu"
          ><i class="fa-solid fa-pen-to-square"></i><span>Site Content</span></a
        >
        <a href="logs.html" class="menu active adminOnly"
          ><i class="fas fa-history"></i><span>Logs</span></a
        >
        <a href="settings.html" class="menu"
          ><i class="fas fa-cog"></i><span>Settings</span></a
        >
      </div>

      <div class="sidebarFooter">
        <div class="userCard">
          <div class="userAvatar">
            <div class="avatarBox" id="usernameLogo"></div>
            <div class="statusIndicator"></div>
          </div>
          <div class="userDetails">
            <span class="username" id="usernameLabel"></span>
            <span class="userRole" id="roleLabel"></span>
          </div>
          <button class="logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="tableToolbar">
        <div class="searchBox">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search logs or user IDs..."
          />
        </div>
        <div class="filterGroup">
          <div class="customSelect">
            <select id="filterSelect" class="filterSelect">
              <option value="">All Event Types</option>
              <option value="auth">Authentication</option>
              <option value="system">System</option>
              <option value="user">User Actions</option>
            </select>
            <i class="fas fa-chevron-down selectIcon"></i>
          </div>
          <input type="date" id="datePicker" class="datePicker" />
        </div>
      </div>

      <div class="tableCard">
        <table class="logsTable">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>User ID</th>
              <th>Event Type</th>
              <th>Activity Description</th>
            </tr>
          </thead>
          <tbody id="logTableBody">
            <!-- Logs injected via JS -->
          </tbody>
        </table>

        <div class="tablePagination">
          <span id="paginationText">Showing 0 to 0 of 0 logs</span>
          <div class="paginationBtns" id="paginationBtns">
            <!-- Pagination injected via JS -->
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/sidebar.js"></script>
    <script>
      initAuth(["Administrator"]);
    </script>
    <script src="assets/js/alert.js"></script>
    <script src="assets/js/logs.js"></script>
  </body>
</html>
