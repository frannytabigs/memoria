<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <meta content="/" property="og:url" />
    <meta property="og:site_name" content="Memoria" />
    <meta content="#2f3136" name="theme-color" />
    <meta name="author" content="Team DND" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://static.wikia.nocookie.net/reborn/images/6/67/Sky_Ring_Battle.PNG/revision/latest?cb=20120422065712"
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />
    <title>Log In</title>

    <link rel="stylesheet" href="assets/css/root.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="container">
        <div class="logoSection">
          <img src="assets/images/MandaueLogo.png" alt="Mandaue City Logo" />
          <img
            src="assets/images/DGSLogo.png"
            alt="Department of General Services Logo"
          />

          <div class="headerText">
            <h1>Depertment of General Services</h1>
            <h2>Mandaue City</h2>
          </div>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="main">
      <!-- HERO SECTION -->
      <section>
        <div class="banner">
          <img src="assets/images/MemoriaLogo.png" alt="Memoria Logo" />
          <p class="cemeteryName">Mandaue City Public Cemetery</p>
        </div>
      </section>

      <!-- LOGIN FORM -->
      <section>
        <div class="inputWrapper">
          <h2 class="inputHeader">Log into Memoria</h2>

          <form action="#">
            <div class="inputBox">
              <input type="text" placeholder="Username" required />
            </div>

            <div class="inputBox">
              <input type="password" placeholder="Password" required />
            </div>

            <button type="submit" class="loginBtn">Log In</button>

            <div class="forgotPassword">
              <a href="forgot_password.html">Forgot Password?</a>
            </div>

            <a href="signup.html" class="singupBtn loginPage">Sign up</a>
          </form>

          <!-- FOOTER NOTE -->
          <div class="footer">
            <p>System access is restricted to authorized personnel only.</p>
            <a href="#">Contact Administrator</a>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
