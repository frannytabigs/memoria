<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memoria | Reset Password</title>

    <!-- <link rel="icon" href="assets/images/Mlogo.png" type="image/png" /> -->

    <link rel="stylesheet" href="assets/css/auth.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navBar">
      <div class="navContainer">
        <div class="navLogoSection">
          <img
            src="assets/images/MandaueLogo.png"
            alt="Mandaue City Logo"
            class="navLogo"
          />
          <img
            src="assets/images/DGSLogo.png"
            alt="Department of General Services logo"
            class="navLogo"
          />

          <div class="navText" id="navText">
            <h1>DEPARTMENT OF GENERAL SERVICES</h1>
            <h2>MANDAUE CITY</h2>
          </div>
        </div>

        <div class="navLink">
          <a href="index.html" class="btnNav">Log In</a>
        </div>
      </div>
    </header>

    <div class="wrapper">
      <form action="#" id="resetform">
        <h1 class="memoriaLogo">
          <img
            src="assets/images/MemoriaLogo.png"
            alt="Memoria"
            class="mLogo"
          />
        </h1>
        <p class="subtitle" id="cemetery_name">
          Mandaue City Municipal Cemetery
        </p>

        <div class="inputBox">
          <input
            type="text"
            placeholder="Fullname"
            name="name"
            id="name"
            required
          />
          <i class="bx bxs-user-detail"></i>
        </div>

        <div class="inputBox">
          <input
            type="text"
            placeholder="Username"
            name="username"
            id="username"
            required
          />
          <i class="bx bxs-user-circle"></i>
        </div>

        <div class="inputBox">
          <input
            type="email"
            placeholder="Email Address"
            name="email"
            id="email"
            required
          />
          <i class="bx bxs-envelope"></i>
        </div>

        <div class="inputBox">
          <input
            type="tel"
            placeholder="Phone Number"
            name="phone_number"
            id="phone_number"
            required
          />
          <i class="bx bxs-phone"></i>
        </div>

        <div class="inputBox">
          <input
            type="password"
            placeholder="Password"
            id="password"
            name="password"
            required
          />
          <i class="bx bxs-lock-alt"></i>
        </div>

        <button type="submit" class="btn">RESET PASSWORD</button>
      </form>
    </div>
    <script src="assets/js/modal.js"></script>
    <script src="assets/js/loggedinalready.js"></script>
    <script src="assets/js/reset.js"></script>
  </body>
</html>
